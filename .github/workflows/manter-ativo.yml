# Acessa o banco todo dia (para o plano gratuito do Supabase não pausar por inatividade)
# e, aos domingos, guarda uma cópia dos registros na pasta backups/ deste repositório.
# A cópia semanal precisa do segredo SUPABASE_SERVICE_KEY (Settings > Secrets and variables > Actions).
name: Manter ativo e copiar registros
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
env:
  SB_URL: https://mgvtfpwercpypspaaaod.supabase.co
  SB_PUB: sb_publishable_Di-G-orlFwIGeIU1IWHqWg_-X5_dXxQ
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acesso diário
        run: curl -fsS "$SB_URL/rest/v1/equipamentos?select=id&limit=1" -H "apikey: $SB_PUB" -o /dev/null
      - uses: actions/checkout@v4
      - name: Cópia semanal dos registros
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SB_KEY" ]; then echo "Sem SUPABASE_SERVICE_KEY: cópia não feita."; exit 0; fi
          if [ "$(date -u +%u)" != "7" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          mkdir -p backups
          for t in registros testes equipamentos autorizados; do
            curl -fsS "$SB_URL/rest/v1/$t?select=*" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -o "backups/$t.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "Cópia semanal dos registros ($(date -u +%F))"
          git push
